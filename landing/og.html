<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1b2a;
    --surface:#13233a;
    --card:#162236;
    --border:#1e3050;
    --cream:#f5eeda;
    --orange:#e8935a;
    --gold:#f0c04a;
    --teal:#3a8a8a;
    --muted:#8a9ab0;
    --gradient: linear-gradient(135deg,#f0c04a,#e8935a);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: var(--bg);
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    color: var(--cream);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    top: -180px; right: -120px;
    width: 640px; height: 640px;
    background: radial-gradient(circle, rgba(240,192,74,0.14) 0%, transparent 62%);
    pointer-events: none;
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 460px;
    align-items: center;
    gap: 48px;
    padding: 0 72px;
  }

  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--gold);
    margin-bottom: 26px;
  }

  h1 {
    font-size: 68px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -2.5px;
    margin-bottom: 22px;
  }
  h1 .g {
    background: linear-gradient(135deg,#f0c04a,#e8935a);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .sub {
    font-size: 22px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 520px;
  }

  .mascot-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.45), 0 0 60px rgba(240,192,74,0.08);
  }
  .mascot-inner {
    background: var(--cream);
    border-radius: 16px;
    overflow: hidden;
  }
  .mascot-inner img {
    display: block;
    width: 100%;
    height: 360px;
    object-fit: cover;
  }
  .mascot-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #0d1b2a;
    text-align: center;
    padding: 12px 0 14px;
  }

  .ticker {
    background: var(--gold);
    color: #0d1b2a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    white-space: nowrap;
    overflow: hidden;
    padding: 13px 0 15px;
  }
</style>
</head>
<body>
  <div class="main">
    <div>
      <div class="badge">MacClosedAwake</div>
      <h1>Close the lid.<br><span class="g">Stay awake.</span></h1>
      <p class="sub">The yellow sheep keeps your Mac running — lid closed, no external display, no sleep.</p>
    </div>
    <div class="mascot-card">
      <div class="mascot-inner">
        <img src="assets/mascot-hero.png" alt="">
        <div class="mascot-label">Yellow Sheep · Keep Awake</div>
      </div>
    </div>
  </div>
  <div class="ticker">LID CLOSED · MAC AWAKE · NO EXTERNAL DISPLAY · BREW INSTALL MAC-CLOSED-AWAKE · ● SLEEP DISABLED · LID CLOSED · MAC AWAKE · NO EXTERNAL DISPLAY</div>
</body>
</html>
