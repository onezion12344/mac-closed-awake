<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="wool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c04a"/>
      <stop offset="1" stop-color="#e8935a"/>
    </linearGradient>
  </defs>
  <!-- navy rounded-square tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#0d1b2a"/>
  <!-- teal spiral ears/horns -->
  <g fill="#3a8a8a">
    <circle cx="62" cy="126" r="27"/>
    <circle cx="194" cy="126" r="27"/>
  </g>
  <g fill="none" stroke="#0d1b2a" stroke-opacity="0.35" stroke-width="6">
    <circle cx="62" cy="126" r="15"/>
    <circle cx="194" cy="126" r="15"/>
  </g>
  <circle cx="62" cy="126" r="5" fill="#0d1b2a" fill-opacity="0.35"/>
  <circle cx="194" cy="126" r="5" fill="#0d1b2a" fill-opacity="0.35"/>
  <!-- gold curly wool cap: a few overlapping circles -->
  <g fill="url(#wool)">
    <circle cx="88" cy="104" r="24"/>
    <circle cx="168" cy="104" r="24"/>
    <circle cx="110" cy="90" r="26"/>
    <circle cx="146" cy="90" r="26"/>
    <circle cx="128" cy="106" r="30"/>
    <circle cx="128" cy="160" r="58"/>
  </g>
  <!-- cream face -->
  <circle cx="128" cy="152" r="46" fill="#f5eeda"/>
  <!-- eyes: left open, right winking -->
  <circle cx="109" cy="146" r="7" fill="#0d1b2a"/>
  <circle cx="111.5" cy="143.5" r="2.2" fill="#f5eeda"/>
  <path d="M138 146q9 8 18 0" fill="none" stroke="#0d1b2a" stroke-width="5" stroke-linecap="round"/>
  <!-- nose + smile -->
